name: musicplayer
description: Cross-platform (iOS/Android) music player with login, ported from the MusicFree Vue page.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # If `flutter pub get` reports a version conflict, pin just_audio to ^0.9.42.
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  # Desktop (Windows/Linux) playback backend for just_audio.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
