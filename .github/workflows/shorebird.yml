name: Shorebird OTA (hot update)

# iOS 热更新（Code Push）说明：
# 1. 用户手机上安装的包必须是用 `shorebird release ios` 构建的「基线包」，
#    普通 workflow 产出的 IPA 收不到补丁；
# 2. 之后改代码只需 `shorebird patch ios`，App 下次冷启动自动下载并应用；
# 3. 需要仓库 Secret：SHOREBIRD_TOKEN（console.shorebird.dev → API Keys）；
# 4. 需要提交 shorebird.yaml（含 app_id），可从 console 创建应用后拿到。
#
# 未配置上面两项时，工作流会直接跳过（不会报红），配好后自动开始推送补丁。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'release = 生成基线安装包；patch = 推送热更新补丁'
        type: choice
        options: [patch, release]
        default: patch
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'shorebird.yaml'

concurrency:
  group: shorebird-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ship:
    name: Shorebird ${{ inputs.mode || 'patch' }}
    runs-on: macos-15
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: '3.47.7'
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      MODE: ${{ inputs.mode || 'patch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prerequisites
        id: check
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::notice title=跳过热更新::仓库未配置 SHOREBIRD_TOKEN"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f shorebird.yaml ]; then
            echo "::notice title=跳过热更新::仓库缺少 shorebird.yaml（需先创建 Shorebird 应用）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          cat shorebird.yaml

      - name: Setup Flutter
        if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Shorebird
        if: steps.check.outputs.ready == 'true'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      # ---------- 基线包（首次安装用） ----------
      - name: Shorebird release
        if: steps.check.outputs.ready == 'true' && env.MODE == 'release'
        run: shorebird release ios --no-codesign

      # 安装只需要 IPA；dSYM 单独上传，避免下载包里混入几十兆符号文件。
      - name: Upload IPA
        if: steps.check.outputs.ready == 'true' && env.MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM (optional)
        if: steps.check.outputs.ready == 'true' && env.MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-dsym
          path: build/ios/archive/*.xcarchive
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 热更新补丁 ----------
      - name: Shorebird patch
        if: steps.check.outputs.ready == 'true' && env.MODE == 'patch'
        run: |
          set +e
          output=$(shorebird patch ios 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -qiE "no release|release not found"; then
              echo "::notice title=跳过热更新::还没有基线包，请先手动运行一次 mode=release"
              exit 0
            fi
            exit $status
          fi

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "### Shorebird ${MODE} 完成" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "patch" ]; then
            echo "- 补丁已推送，用户下次冷启动自动生效。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 基线包已生成，请下载 artifact 侧载安装。" >> "$GITHUB_STEP_SUMMARY"
          fi
