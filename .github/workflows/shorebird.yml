name: Shorebird OTA (hot update)

# iOS 热更新（Code Push）说明：
# 1. 用户手机上安装的包必须是用 `shorebird release ios` 构建的「基线包」，
#    普通 workflow 产出的 IPA 收不到补丁；
# 2. 之后改代码只需 `shorebird patch ios`，App 下次冷启动自动下载并应用；
# 3. 需要仓库 Secret：SHOREBIRD_TOKEN（console.shorebird.dev → API Keys）；
# 4. 需要提交 shorebird.yaml（含 app_id），可从 console 创建应用后拿到。
#
# 未配置上面两项时，工作流会直接跳过（不会报红），配好后自动开始推送补丁。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'release = 生成基线安装包；patch = 推送热更新补丁'
        type: choice
        options: [patch, release]
        default: patch
  push:
    branches: [main, master]
    # Pushing a v* tag builds a new baseline release automatically.
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'shorebird.yaml'

permissions:
  contents: write

concurrency:
  group: shorebird-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ship:
    name: Shorebird ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'release' || inputs.mode || 'patch' }}
    runs-on: macos-15
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: '3.47.7'
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      MODE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'release' || inputs.mode || 'patch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prerequisites
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::notice title=跳过热更新::仓库未配置 SHOREBIRD_TOKEN"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f shorebird.yaml ]; then
            echo "::notice title=跳过热更新::仓库缺少 shorebird.yaml（需先创建 Shorebird 应用）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release commit bumps the version, so a patch cannot apply yet.
          # Skip it and let the tag-triggered release do the work.
          if [ "$MODE" = "patch" ] && echo "$COMMIT_MSG" | head -1 | grep -qiE '^release:'; then
            echo "::notice title=跳过补丁::这是发布提交（版本号已变更），请用标签触发 release"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          cat shorebird.yaml

      - name: Setup Flutter
        if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Shorebird
        if: steps.check.outputs.ready == 'true'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      # ---------- 基线包（首次安装用） ----------
      - name: Shorebird release
        if: steps.check.outputs.ready == 'true' && env.MODE == 'release'
        run: |
          set -euo pipefail
          shorebird release ios --no-codesign

          # --no-codesign 时 Shorebird 只产出 .xcarchive，不会生成 IPA。
          # 这里用 ldid 伪签名后手工打成可侧载的 IPA。
          if ! ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            echo "::notice::未生成 IPA，正在从 xcarchive 打包…"
            APP_DIR=$(find build/ios/archive -maxdepth 4 -type d -name "Runner.app" | head -1)
            if [ -z "$APP_DIR" ]; then
              echo "::error::找不到 Runner.app，无法打包 IPA"
              exit 1
            fi
            brew install ldid >/dev/null 2>&1 || true
            ldid -S "$APP_DIR/Runner" || true
            rm -rf build/ios/ipa_payload
            mkdir -p build/ios/ipa_payload/Payload build/ios/ipa
            cp -R "$APP_DIR" build/ios/ipa_payload/Payload/
            (cd build/ios/ipa_payload && zip -qry "$GITHUB_WORKSPACE/LIPlayer-shorebird.ipa" Payload)
            mv "$GITHUB_WORKSPACE/LIPlayer-shorebird.ipa" build/ios/ipa/
          fi
          ls -lh build/ios/ipa

      # 安装只需要 IPA；dSYM 单独上传，避免下载包里混入几十兆符号文件。
      - name: Upload IPA
        if: steps.check.outputs.ready == 'true' && env.MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM (optional)
        if: steps.check.outputs.ready == 'true' && env.MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-dsym
          path: build/ios/archive/*.xcarchive
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 热更新补丁 ----------
      - name: Shorebird patch
        if: steps.check.outputs.ready == 'true' && env.MODE == 'patch'
        run: |
          set +e
          output=$(shorebird patch ios --no-codesign 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -qiE "no release|release not found"; then
              echo "::notice title=跳过热更新::还没有基线包，请先手动运行一次 mode=release"
              exit 0
            fi
            if echo "$output" | grep -qiE "asset changes"; then
              echo "::notice title=需要重新发基线::本次改动包含资源变化（如新增图标），无法只发补丁。请提升 pubspec 版本号后运行 mode=release"
              exit 0
            fi
            # Publish the failure log so it can be inspected without CI access.
            printf '%s\n' "$output" > patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f patch-error.log
            git commit -m "chore: shorebird patch failure log [skip ci]" || true
            git push || true
            exit $status
          fi

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "### Shorebird ${MODE} 完成" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "patch" ]; then
            echo "- 补丁已推送，用户下次冷启动自动生效。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 基线包已生成，请下载 artifact 侧载安装。" >> "$GITHUB_STEP_SUMMARY"
          fi
