name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建类型'
        type: choice
        options: [release, debug]
        default: release
  # 只在手动触发时打完整包。
  # - 日常代码改动 → Shorebird 自动推补丁
  # - 打 v* 标签 → 由 Shorebird 的 release 流程产出 IPA（避免重复打包）

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: '3.47.7'
      # --- 可选：配置后自动做签名打包，未配置则产出未签名 IPA ---
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------- 有证书：签名打包 ----------
      - name: Build signed IPA
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          flutter build ipa --${{ inputs.build_mode || 'release' }} \
            --export-options-plist=ios/ExportOptions.plist

      # ---------- 无证书：未签名 IPA ----------
      - name: Build unsigned app
        if: env.BUILD_CERTIFICATE_BASE64 == ''
        run: |
          flutter build ios --${{ inputs.build_mode || 'release' }} --no-codesign

          # ldid 伪签名：让未签名包在越狱设备 / TrollStore 上可直接安装，
          # Sideloadly、AltStore 也会在安装时覆盖签名。
          brew install ldid || true
          ldid -S build/ios/iphoneos/Runner.app/Runner || true

          mkdir -p build/ios/ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -qry "$GITHUB_WORKSPACE/LIPlayer-unsigned.ipa" Payload

      - name: Collect artifacts
        run: |
          mkdir -p dist
          if [ -d build/ios/ipa ]; then
            cp build/ios/ipa/*.ipa dist/ || true
          fi
          if [ -f LIPlayer-unsigned.ipa ]; then
            cp LIPlayer-unsigned.ipa dist/
          fi
          ls -lh dist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LIPlayer-ipa
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload xcarchive (debug symbols)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIPlayer-xcarchive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: ignore
          retention-days: 7
